name: ARM images

# Aspia Router + Relay for ARM, both built here from the sources (the developer of Aspia publishes
# no Router/Relay for ARM; his arm64 CI builds are kept for 7 days only):
#  - armv7 (32-bit) and arm64 (64-bit), cross compiled on x86_64, each with its own vcpkg cache;
#  - release "aspia-<version>": archives for the self-update inside the container
#    (aspia-server-<version>-linux-<arch>[-upx].tar.gz + .sha256);
#  - images: ghcr.io/<owner>/aspia-server-arm (armv7 + arm64), ghcr.io/<owner>/aspia-server-mikrotik
#    (UPX-compressed binaries and a minimal system for the built-in flash of MikroTik routers).
# The x86_64 images (publish.yml) are not touched.

on:
  push:
    branches: [main]
    paths:
      - "arm/**"
      - ".github/workflows/arm.yml"
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Aspia version to build (empty = latest release)"
        required: false
        default: ""
      force:
        description: "Build the binaries again even if they are published"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: arm
  cancel-in-progress: false

env:
  UPSTREAM: dchapyshev/aspia

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      latest: ${{ steps.version.outputs.latest }}
      minor_latest: ${{ steps.version.outputs.minor_latest }}
      legacy: ${{ steps.version.outputs.legacy }}
      arches: ${{ steps.decide.outputs.arches }}
      build_images: ${{ steps.decide.outputs.build_images }}
    steps:
      - name: Aspia version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tags="$(gh api "repos/${UPSTREAM}/releases?per_page=100" \
            -q '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sed 's/^v//')"
          latest="$(gh api "repos/${UPSTREAM}/releases/latest" -q .tag_name)"
          latest="${latest#v}"
          version="${INPUT_VERSION:-$latest}"
          version="${version#v}"
          [[ "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "Bad version: ${version}"; exit 1; }
          minor="${version%.*}"
          newest_in_minor="$(grep -E "^${minor//./\\.}\.[0-9]+$" <<<"${tags}" | sort -V | tail -n 1)"
          {
            echo "version=${version}"
            echo "tag=aspia-${version}"
            echo "latest=$([[ "${version}" == "${latest}" ]] && echo true || echo false)"
            echo "minor_latest=$([[ "${version}" == "${newest_in_minor}" ]] && echo true || echo false)"
            # 3.1 removed the 2.x hosts and the 2.x migration
            echo "legacy=$([[ "${version}" == 2.* || "${version}" == 3.0.* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Aspia ${version} (latest release: ${latest}, newest ${minor}.x: ${newest_in_minor})"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Decide what to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          assets="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets[].name' 2>/dev/null || true)"
          has() { grep -qxF "$1" <<<"${assets}"; }
          name="aspia-server-${VERSION}-linux"

          # Architectures without both archives (plain + UPX) in the release are built
          arches=()
          for arch in armv7 arm64; do
            if [[ "${FORCE}" == "true" ]] ||
               ! { has "${name}-${arch}.tar.gz.sha256" && has "${name}-${arch}-upx.tar.gz.sha256"; }; then
              arches+=("${arch}")
            fi
          done
          arches_json="$(printf '%s\n' "${arches[@]}" | jq -R . | jq -sc 'map(select(. != ""))')"

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          build_images=true
          if [[ "${EVENT}" == "schedule" && "${arches_json}" == "[]" ]] &&
             docker manifest inspect "ghcr.io/${owner}/aspia-server-mikrotik:${VERSION}" >/dev/null 2>&1; then
            build_images=false
          fi
          {
            echo "arches=${arches_json}"
            echo "build_images=${build_images}"
          } >> "$GITHUB_OUTPUT"
          echo "build: ${arches_json}, images: ${build_images}"

  build:
    needs: prepare
    if: needs.prepare.outputs.arches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      # The build runs a few ARM tools through QEMU.
      - name: QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64

      # vcpkg checks the ABI of every package itself, so an older cache of the same architecture is
      # always safe to start from.
      - name: Restore the vcpkg cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            work/vcpkg-cache
            work/vcpkg-downloads
          key: ${{ matrix.arch }}-vcpkg-${{ hashFiles('arm/builder/Dockerfile', 'arm/builder/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.arch }}-vcpkg-

      - name: Builder image
        run: docker build -t aspia-arm-builder arm/builder

      # A step timeout (not the job one) leaves time to save the cache: the first build of all the
      # dependencies may take longer than one run, the next run continues from the cache.
      - name: Build
        timeout-minutes: 300
        run: |
          docker run --rm -v "${PWD}/work:/work" -v "${PWD}/arm/builder:/scripts:ro" \
            aspia-arm-builder bash /scripts/build.sh "${VERSION}" "${ARCH}"

      # The main errors also go to the annotations of the run: they are visible without signing in.
      - name: Build logs
        if: failure()
        run: |
          sudo chown -R "$(id -u):$(id -g)" work || true
          annotate() {
            local text
            text="$(head -c 60000 | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); gsub(/\r/, ""); print }')"
            [[ -n "${text}" ]] || return 0
            echo "::error title=${ARCH}: $1::${text}"
          }
          grep -h -E "^error:|failed with|BUILD_FAILED|CMake Error" work/vcpkg-install-*-"${ARCH}".log 2>/dev/null |
            head -n 40 | annotate "vcpkg"
          grep -h -A 25 "CMake Error" work/cmake-configure-*-"${ARCH}".log 2>/dev/null | head -n 80 | annotate "configure"
          grep -h -B 2 -A 10 -E "error:|FAILED:" work/cmake-build-*-"${ARCH}".log 2>/dev/null | head -n 120 |
            annotate "compiler"
          find work/aspia-*/vcpkg4aspia/buildtrees -name '*-err.log' -size +0 2>/dev/null | head -n 3 |
            while read -r log; do tail -n 40 "${log}" | annotate "$(basename "${log}")"; done
          for log in work/vcpkg-install-*-"${ARCH}".log work/cmake-configure-*-"${ARCH}".log; do
            [[ -f "${log}" ]] || continue
            echo "::group::${log}"
            tail -n 150 "${log}"
            echo "::endgroup::"
          done
          if [[ -f "work/cmake-build-${VERSION}-${ARCH}.log" ]]; then
            echo "::group::compiler errors"
            grep -n -B 3 -A 12 -E "error:|FAILED:" "work/cmake-build-${VERSION}-${ARCH}.log" | head -n 300
            echo "::endgroup::"
          fi
          # vcpkg writes the details of a failed port into buildtrees
          find work/aspia-*/vcpkg4aspia/buildtrees -name '*-err.log' -newer arm/builder/build.sh 2>/dev/null |
            while read -r log; do
              echo "::group::${log}"
              tail -n 80 "${log}"
              echo "::endgroup::"
            done

      # Saved even after a failure or a timeout: the next run continues with the packages built so far.
      - name: Ownership of the build files
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" work

      - name: Save the vcpkg cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            work/vcpkg-cache
            work/vcpkg-downloads
          key: ${{ matrix.arch }}-vcpkg-${{ hashFiles('arm/builder/Dockerfile', 'arm/builder/triplets/**') }}-${{ github.run_id }}

      - name: Upload to the release
        run: |
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # both architectures may get here at the same time
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease --target "${GITHUB_SHA}" \
              --title "Aspia ${VERSION} for ARM" \
              --notes "Aspia Router + Relay ${VERSION} for ARM (armv7, arm64): archives for the self-update of the images \`aspia-server-arm\` and \`aspia-server-mikrotik\` (see docs/mikrotik-container.md). Built by this repository from https://github.com/${UPSTREAM}/releases/tag/v${VERSION}." ||
              gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "work/out/aspia-server-${VERSION}-linux-${ARCH}"*

  images:
    needs: [prepare, build]
    # Only when every architecture that had to be built is in the release: the next run builds the
    # missing one again (from the cache) and publishes the images then.
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled' &&
      needs.prepare.outputs.build_images == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Binaries from the release
        id: bins
        run: |
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "aspia-server-${VERSION}-linux-*" --dir dl
          platforms=""
          for arch in armv7 arm64; do
            for flavor in "" "-upx"; do
              name="aspia-server-${VERSION}-linux-${arch}${flavor}.tar.gz"
              [[ -f "dl/${name}" ]] || continue
              (cd dl && sha256sum -c "${name}.sha256")
              dir="arm/runtime/bin${flavor}/${arch}"
              mkdir -p "${dir}" && tar -xzf "dl/${name}" -C "${dir}"
            done
            if [[ -f "arm/runtime/bin/${arch}/aspia_router" && -f "arm/runtime/bin-upx/${arch}/aspia_router" ]]; then
              platforms="${platforms:+${platforms},}linux/$([[ "${arch}" == armv7 ]] && echo arm/v7 || echo arm64)"
            fi
          done
          [[ -n "${platforms}" ]] || { echo "No binaries in the release ${TAG}"; exit 1; }
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "platforms: ${platforms}"

      - name: Tags
        id: tags
        env:
          LATEST: ${{ needs.prepare.outputs.latest }}
          MINOR_LATEST: ${{ needs.prepare.outputs.minor_latest }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in arm mikrotik; do
            name="ghcr.io/${owner}/aspia-server-${image}"
            tags="${name}:${VERSION}"
            [[ "${MINOR_LATEST}" == "true" ]] && tags="${tags},${name}:${VERSION%.*}"
            [[ "${LATEST}" == "true" ]] && tags="${tags},${name}:latest"
            echo "${image}=${tags}" >> "$GITHUB_OUTPUT"
            echo "${image}: ${tags}"
          done

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64

      - uses: docker/setup-buildx-action@v4

      - name: Smoke test (emulated)
        env:
          AUTO_UPDATE: ${{ needs.prepare.outputs.legacy == 'true' && '0' || '1' }}
          PLATFORMS: ${{ steps.bins.outputs.platforms }}
        run: |
          for platform in ${PLATFORMS//,/ }; do
            for file in Dockerfile Dockerfile.mikrotik; do
              echo "::group::${platform} ${file}"
              docker buildx build --platform "${platform}" --load -t "aspia-test:${file}" -f "arm/runtime/${file}" \
                --build-arg "ASPIA_VERSION=${VERSION}" --build-arg "AUTO_UPDATE=${AUTO_UPDATE}" arm/runtime
              docker run -d --name test --platform "${platform}" -e EXTERNAL_IP=127.0.0.1 -e AUTO_UPDATE=0 "aspia-test:${file}"
              ok=false
              for _ in $(seq 1 36); do
                sleep 5
                docker exec test aspia_health >/dev/null 2>&1 && { ok=true; break; }
              done
              docker logs test 2>&1 | grep -v "Password:"
              docker exec test aspia_router --version | grep -F "${VERSION}"
              docker rm -f test
              echo "::endgroup::"
              [[ "${ok}" == "true" ]] || { echo "${platform} ${file}: the server did not become healthy"; exit 1; }
            done
          done

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push aspia-server-arm
        uses: docker/build-push-action@v7
        with:
          context: ./arm/runtime
          file: ./arm/runtime/Dockerfile
          platforms: ${{ steps.bins.outputs.platforms }}
          build-args: |
            ASPIA_VERSION=${{ env.VERSION }}
            AUTO_UPDATE=${{ needs.prepare.outputs.legacy == 'true' && '0' || '1' }}
          push: true
          tags: ${{ steps.tags.outputs.arm }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Push aspia-server-mikrotik
        uses: docker/build-push-action@v7
        with:
          context: ./arm/runtime
          file: ./arm/runtime/Dockerfile.mikrotik
          platforms: ${{ steps.bins.outputs.platforms }}
          build-args: |
            ASPIA_VERSION=${{ env.VERSION }}
            AUTO_UPDATE=${{ needs.prepare.outputs.legacy == 'true' && '0' || '1' }}
          push: true
          tags: ${{ steps.tags.outputs.mikrotik }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
